<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>У меня есть кое-что для тебя...</title>
<style>
:root{--ink:#352b49;--muted:#756982;--white:#fff;--glass:rgba(255,255,255,.62);--line:rgba(255,255,255,.75);--shadow:0 22px 70px rgba(83,54,115,.18)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(135deg,#A18CD1 0%,#C6A7DC 48%,#FBC2EB 100%);background-attachment:fixed;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:-1}
body:before{width:330px;height:330px;background:#fff5;top:-110px;left:-100px}
body:after{width:420px;height:420px;background:#d7baff55;bottom:-180px;right:-120px}
main{width:min(760px,calc(100% - 28px));margin:0 auto;padding:34px 0 60px;min-height:100vh;display:flex;align-items:center}
.panel{width:100%;padding:clamp(22px,5vw,44px);border:1px solid var(--line);border-radius:30px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--shadow);animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
h1{font-size:clamp(2rem,6vw,3.35rem);line-height:1.08;margin:0 0 16px;letter-spacing:-.04em}
h2{font-size:clamp(1.45rem,4vw,2.15rem);margin:0 0 12px;letter-spacing:-.025em}
p{line-height:1.65;color:var(--muted);font-size:1.04rem}
.center{text-align:center}.center p{max-width:540px;margin:12px auto 26px}
button,.btn{border:0;border-radius:16px;padding:14px 22px;font-size:1rem;font-weight:750;cursor:pointer;color:white;background:linear-gradient(120deg,#8f70c6,#c58bd4,#eaa8d0);box-shadow:0 10px 25px #9671bd44;transition:transform .18s,filter .18s,box-shadow .18s}
button:hover{transform:translateY(-2px);filter:saturate(1.12);box-shadow:0 14px 30px #9671bd66}
button:active{transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.secondary{background:#ffffffa8;color:#634d7c;border:1px solid #fff;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}
.answers{display:grid;gap:12px;margin:24px 0}
.choice{width:100%;background:#fff9;color:#59466f;border:1px solid #fff;box-shadow:none;text-align:left}
.choice:hover,.choice.selected{background:linear-gradient(120deg,#a18cd1,#e8b8e2);color:#fff}
input,textarea{width:100%;padding:15px 16px;border:1px solid #fff;border-radius:15px;background:#ffffffbd;color:var(--ink);font:inherit;outline:none;margin:10px 0 16px}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{border-color:#a18cd1;box-shadow:0 0 0 3px #a18cd133}
.hint{min-height:26px;color:#8d477b;font-weight:700;margin:4px 0 12px}
.progress{height:7px;background:#fff8;border-radius:99px;overflow:hidden;margin-bottom:25px}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#8f70c6,#efacd2);transition:width .3s}
.topline{display:flex;justify-content:space-between;align-items:center;color:#806b91;font-size:.85rem;margin-bottom:12px}
.track{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid #fff;background:#ffffff91;border-radius:16px;margin:10px 0}
.track .disc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a18cd1,#fbc2eb);color:white;font-size:1.15rem}
.track .trackname{flex:1;font-weight:700}
.track input[type=file]{max-width:190px;margin:0;padding:7px;font-size:.8rem}
.small{font-size:.86rem}.hidden{display:none!important}
.heart{font-size:2.2rem;animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.12)}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}
.emoji-picker{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 18px}.emoji-option{width:48px;height:48px;padding:0;border-radius:14px;background:#ffffffb8;color:var(--ink);border:1px solid #fff;box-shadow:none;font-size:1.55rem}.emoji-option.selected{background:linear-gradient(120deg,#8f70c6,#eaa8d0);color:#fff;outline:2px solid #fff}.admin-list{display:grid;gap:12px}.answer-card{background:#fff9;border:1px solid white;padding:14px;border-radius:14px;overflow-wrap:anywhere}
footer{text-align:center;color:#fff9;font-size:.8rem;margin-top:18px}
@media(max-width:520px){.panel{border-radius:23px}.track{flex-wrap:wrap}.track input[type=file]{max-width:100%;width:100%}}
</style>
</head>
<body>
<main><section class="panel" id="app" aria-live="polite"></section></main>
<script>
const app=document.getElementById('app');
const ADMIN_MODE=new URLSearchParams(location.search).has('admin');
const STORE='purpleDreamBetaAnswers_v1';
let answers=JSON.parse(localStorage.getItem(STORE)||'{}');
let selectedAudio=[];
let selectedLoveEmojis=[];
let step=0;
const steps=[
 {type:'welcome'},
 {type:'mood'},
 {type:'ready'},
 {type:'warmAge'},
 {type:'warmDay'},
 {type:'musicIntro'},
 {type:'music'},
 {type:'age'},
 {type:'birthday'},
 {type:'meeting'},
 {type:'free'},
 {type:'walk'},
 {type:'when'},
 {type:'finish'}
];
const save=()=>localStorage.setItem(STORE,JSON.stringify(answers));
function shell(content,progress=true){
 app.innerHTML=(progress?`<div class="topline"><span>Небольшой сюрприз ❤️</span><span>${Math.min(step,13)} / 13</span></div><div class="progress"><span style="width:${Math.min(step/13*100,100)}%"></span></div>`:'')+content;
}
function next(){step++;render()}
function note(text){const el=document.getElementById('hint');if(el)el.textContent=text}
function textQuestion(title,placeholder,key,type='text'){
 shell(`<h2>${title}</h2><input id="answer" type="${type}" placeholder="${placeholder}" autocomplete="off"><div class="hint" id="hint"></div><button id="send">Отправить</button>`);
 document.getElementById('send').onclick=()=>{const v=document.getElementById('answer').value.trim();if(!v){note('Пожалуйста, напиши ответ.');return}answers[key]=v;save();next()};
}
function choices(title,opts,onPick){
 shell(`<h2>${title}</h2><div class="answers">${opts.map((x,i)=>`<button class="choice" data-i="${i}">${x}</button>`).join('')}</div><div class="hint" id="hint"></div>`);
 app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>onPick(Number(b.dataset.i)));
}
function render(){
 const s=steps[step];
 if(!s)return;
 if(s.type==='welcome'){shell(`<div class="center"><h1>У меня есть кое-что для тебя...</h1><p>Небольшой сюрприз и несколько вопросов ❤️</p><button id="go">Начать</button></div>`,false);document.getElementById('go').onclick=next}
 if(s.type==='mood')choices('Как дела?',['Отлично!','Нормально.'],i=>{answers.mood=i===0?'Отлично!':'Нормально.';save();next()});
 if(s.type==='ready')choices('Готова пройти небольшой тест?',['Да','Нет'],i=>{answers.ready=i===0?'Да':'Нет';save();if(i===0)next();else{step=2;shell(`<div class="center"><h2>Я думаю, тебе стоит пройти этот тест</h2><button id="yes">Хорошо</button></div>`);document.getElementById('yes').onclick=next}});
 if(s.type==='warmAge')choices('Сколько тебе лет?',['15','16','18'],i=>{if(i===1){answers.warmAge='16';save();next()}else note('Подумай ещё 🙂')});
 if(s.type==='warmDay'){shell(`<h2>Какого числа у тебя день рождения?</h2><input id="answer" type="text" inputmode="numeric" maxlength="2"><div class="hint" id="hint"></div><button id="send">Ответить</button>`);document.getElementById('send').onclick=()=>{const v=document.getElementById('answer').value.trim();if(v==='21'){answers.warmDay='21';save();next()}else note('Подумай ещё 🙂')}}
 if(s.type==='musicIntro'){shell(`<div class="center"><h2>Ладно, это была всего лишь разминка!</h2><p><strong>Но сначала послушай музыку 🎧</strong></p><button id="continue">Далее →</button></div>`);document.getElementById('continue').onclick=next}
 if(s.type==='music'){shell(`<h2>Немного музыки 🎵</h2><p>Нажми «Выбрать файл» и добавь аудиозаписи. После выбора их можно будет прослушать прямо здесь.</p>${[1,2,3].map((n)=>`<div class="track"><div class="disc">♫</div><div class="trackname">Музыка №${n}</div><input type="file" accept="audio/*" id="audio${n}"></div><div id="player${n}"></div>`).join('')}<div class="row"><button id="nextMusic">Далее →</button></div>`);
 [1,2,3].forEach(n=>document.getElementById('audio'+n).onchange=e=>{const f=e.target.files[0];if(!f)return;const old=document.getElementById('player'+n);old.innerHTML='';const a=document.createElement('audio');a.controls=true;a.src=URL.createObjectURL(f);a.style.width='100%';old.append(a);selectedAudio[n-1]=f});
 document.getElementById('nextMusic').onclick=next}
 if(s.type==='age')choices('Сколько мне лет?',['15','16','18'],i=>{if(i===1){answers.myAge='16';save();next()}else note('Подумай ещё 🙂')});
 if(s.type==='birthday'){shell(`<h2>Какого числа, месяца и года у меня день рождения?</h2><input id="answer" inputmode="numeric"><div class="hint" id="hint"></div><button id="send">Ответить</button>`);document.getElementById('send').onclick=()=>{const digits=document.getElementById('answer').value.replace(/\D/g,'');if(digits==='15042010'){answers.birthday='15.04.2010';save();next()}else note('Подумай ещё 🙂')}}
 if(s.type==='meeting')choices('Где мы познакомились?',['У знакомого в селе','В парке','В школе'],i=>{if(i===0){answers.meeting='У знакомого в селе';save();next()}else note('Подумай ещё 🙂')});
 if(s.type==='free'){selectedLoveEmojis=[];const loveEmojis=['😊','😂','🥰','😍','😘','❤️','💜','🩷','✨','🌸','🦋','🐱','🐻','🍓','🎀','🌙','⭐','☀️','🍕','🎵','🎮','🐶','☕','🌈'];shell(`<h2>Что ты любишь?</h2><div class="emoji-picker">${loveEmojis.map(e=>`<button type="button" class="emoji-option" data-emoji="${e}">${e}</button>`).join('')}</div><textarea id="answer" placeholder="Можешь ещё что-нибудь написать..."></textarea><div class="hint" id="hint"></div><button id="send">Отправить</button>`);app.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>{const e=b.dataset.emoji;const field=document.getElementById('answer');const start=field.selectionStart,end=field.selectionEnd;field.value=field.value.slice(0,start)+e+field.value.slice(end);const pos=start+e.length;field.focus();field.setSelectionRange(pos,pos);if(!selectedLoveEmojis.includes(e))selectedLoveEmojis.push(e);b.classList.add('selected')});document.getElementById('send').onclick=()=>{const v=document.getElementById('answer').value.trim();if(!v){note('Выбери смайлик или напиши ответ.');return}answers.whatLove=v;save();next()}}
 if(s.type==='walk')renderWalk();
 if(s.type==='when'){shell(`<h2>Когда тебе удобно?</h2><p>Выбери удобную дату и время.</p><label>Дата</label><input id="date" type="date"><label>Время</label><input id="time" type="time"><div class="hint" id="hint"></div><button id="send">Отправить</button>`);document.getElementById('send').onclick=()=>{const d=document.getElementById('date').value,t=document.getElementById('time').value;if(!d||!t){note('Выбери дату и время.');return}answers.when=d+' в '+t;save();next()}}
 if(s.type==='finish'){shell(`<div class="center"><div class="heart">🎂</div><h1>С днём рождения!</h1><p>Желаю тебе много счастья, улыбок и прекрасных моментов! ❤️</p><div class="heart">✨ 🎈 💜 🎉</div><p>Если захочешь, напиши мне в Telegram: <strong>@Endurik_ttx</strong></p><a class="btn" href="https://t.me/Endurik_ttx" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Написать</a></div>`,false);confetti()}
}
function renderWalk(){choices('Ты пойдёшь со мной гулять? ❤️',['Да ❤️','Нет'],i=>{if(i===0){answers.walk='Да';save();next()}else{answers.walk='Нет';save();renderSure()}})}
function renderSure(){shell(`<h2>Точно? 🥺</h2><div class="answers"><button class="choice" disabled>Да</button><button class="choice" id="noAgain">Нет</button></div>`);document.getElementById('noAgain').onclick=renderWalk}
function confetti(){const c=document.createElement('div');c.className='confetti';document.body.append(c);for(let i=0;i<65;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'%';x.style.animationDuration=(3+Math.random()*4)+'s';x.style.animationDelay=Math.random()*2+'s';x.style.background=['#fff','#f5b8e4','#a18cd1','#d8c2ff','#f7d5a8'][i%5];c.append(x)}setTimeout(()=>c.remove(),8500)}
function admin(){
 app.innerHTML=`<h2>Закрытый раздел ответов</h2><p>Бета-версия: ответы хранятся только в этом браузере.</p><label>Пароль администратора</label><input id="pass" type="password" placeholder="Введите пароль"><button id="login">Войти</button><div class="hint" id="hint"></div><div id="results" class="admin-list"></div>`;
 document.getElementById('login').onclick=()=>{if(document.getElementById('pass').value!==(localStorage.getItem('purpleDreamAdminPass')||'purple2026')){note('Неверный пароль.');return}
 const box=document.getElementById('results');box.innerHTML='<p><strong>Ответы, сохранённые в этом браузере:</strong></p>';
 const labels={mood:'Как дела?',ready:'Готова пройти небольшой тест?',warmAge:'Возраст (разминка)',warmDay:'День рождения (разминка)',myAge:'Сколько мне лет?',birthday:'Моя дата рождения',meeting:'Где познакомились?',whatLove:'Что ты любишь?',walk:'Пойдёшь гулять?',when:'Когда удобно?'};
 Object.entries(labels).forEach(([k,l])=>{const d=document.createElement('div');d.className='answer-card';d.innerHTML='<strong>'+l+'</strong><br>';d.append(document.createTextNode(answers[k]||'Пока нет ответа'));box.append(d)});
 const change=document.createElement('div');change.className='answer-card';change.innerHTML='<strong>Сменить пароль администратора</strong><p class="small">Пароль хранится локально и не является защитой для опубликованного сайта.</p><input id="newpass" type="password" placeholder="Новый пароль"><button id="savepass">Сохранить пароль</button>';box.append(change);
 document.getElementById('savepass').onclick=()=>{const v=document.getElementById('newpass').value;if(v.length<8){alert('Пароль должен содержать минимум 8 символов.');return}localStorage.setItem('purpleDreamAdminPass',v);alert('Пароль изменён в этом браузере.')};
 };
}
if(ADMIN_MODE)admin();else render();
</script>
</body></html>
